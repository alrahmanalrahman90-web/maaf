.hide{opacity:0;transform:scale(1.08);pointer-events:none}
.glass{background:rgba(255,255,255,.03);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.45);border-radius:26px;box-shadow:0 8px 32px rgba(0,0,0,.2);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 10px rgba(0,0,0,.5)}
#btn{width:120px;height:120px;border-radius:50%;cursor:pointer;display:grid;place-items:center;animation:beat 1.5s infinite;border:1px solid rgba(255,255,255,.5)}
#btn svg{width:58px;height:58px;filter:drop-shadow(0 0 8px #c77dff)}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.cap{margin-top:22px;font-size:20px;font-weight:600;padding:10px 24px;border-radius:40px;animation:fade 1.5s}
#main{opacity:0;pointer-events:none;overflow-y:auto;justify-content:flex-start;padding-top:max(26px,env(safe-area-inset-top))}
#main.show{opacity:1;pointer-events:auto}
#main .glass{width:100%;max-width:320px;padding:14px 16px;border-radius:20px;animation:fade 1.4s;margin:auto 0}
#gif{display:block;width:84px;height:84px;border-radius:50%;object-fit:cover;margin:0 auto 10px;border:3px solid rgba(255,255,255,.7);box-shadow:0 4px 18px rgba(0,0,0,.3)}
#txt p{font-size:14px;line-height:1.5;margin-bottom:8px;min-height:1em}
#txt p:first-child{font-size:18px;font-weight:700;text-align:center}
#txt p.c{text-align:center}
.cur::after{content:"|";margin-left:1px;animation:bl .7s infinite}
@keyframes bl{50%{opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.f{position:fixed;pointer-events:none;z-index:3}
.petal{top:-30px;width:14px;height:11px;background:linear-gradient(135deg,#ffd1e3,#ff8fb8);border-radius:70% 0 70% 0;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}
.heart{bottom:-60px;animation:rise linear forwards}
.heart svg{width:100%;height:100%}
@keyframes rise{0%{transform:translateX(0);opacity:0}10%{opacity:.9}50%{transform:translateX(18px)}100%{transform:translate(-14px,-115vh);opacity:.8}}
.sm{animation-name:rise;animation-iteration-count:infinite;opacity:.5}
</style></head><body>
<div class="page" id="start">
 <div id="btn" class="glass" role="button" aria-label="LOVE"><svg viewBox="0 0 24 24"><path fill="#a855f7" d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.800-8 11-8 11z"/></svg></div>
 <div class="cap glass">Tap LOVEnya!</div>
</div>
<div class="page" id="main"><div class="glass">
 <img id="gif" src="https://htmlku.com/0/panda/muah.gif" alt="" draggable="false">
 <div id="txt"></div>
</div></div>
<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
const H='<svg viewBox="0 0 24 24"><path fill="COL" d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.800-8 11-8 11z"/></svg>';
const cols=['#ff7eb3','#ff5c8d','#c77dff','#ffb3d1','#ff9ecb'];
function add(cls,css,html){const d=document.createElement('div');d.className='f '+cls;Object.assign(d.style,css);if(html)d.innerHTML=html;document.body.appendChild(d);return d}
for(let i=0;i<14;i++)add('petal',{left:Math.random()*100+'vw',animationDuration:8+Math.random()*7+'s',animationDelay:-Math.random()*12+'s',transform:'scale('+(.7+Math.random()*.8)+')'});
for(let i=0;i<7;i++){const s=12+Math.random()*10;add('heart sm',{left:Math.random()*95+'vw',width:s+'px',height:s+'px',animationDuration:14+Math.random()*10+'s',animationDelay:-Math.random()*18+'s'},H.replace('COL',cols[i%5]))}
const lines=["Maaf ya,","Aku terpaksa melakukan semua ini karena aku mencintai kamu. Mungkin kamu nggak pernah meminta aku melakukan semua ini, tapi aku melakukannya karena aku ingin kamu tahu bahwa kamu sangat berarti bagiku.","Maaf kalau selama ini aku sering react chat dan membuat kamu kecewa. Aku sudah berusaha berubah, tapi selalu gagal dan mengulangi kesalahan yang sama.","Percayalah, aku nggak pernah berniat menyakiti hati kamu. Aku benar-benar minta maaf, sayang."];
const box=document.getElementById('txt'),main=document.getElementById('main');
function type(i){
 if(i>=lines.length)return balloons();
 const p=document.createElement('p');if(i==0)p.className='c';p.className+=' cur';box.appendChild(p);
 const ch=Array.from(lines[i]);let k=0;
 (function s(){if(k<ch.length){p.textContent+=ch[k++];main.scrollTop=main.scrollHeight;setTimeout(s,50)}else{p.classList.remove('cur');setTimeout(()=>type(i+1),600)}})();
}
function balloons(){
 let n=0;const t=setInterval(()=>{
  const s=26+Math.random()*34;
  add('heart',{left:Math.random()*88+'vw',width:s+'px',height:s+'px',animationDuration:6+Math.random()*4+'s',filter:'drop-shadow(0 3px 5px rgba(0,0,0,.25))'},H.replace('COL',cols[n%5]));
  if(++n>40)clearInterval(t)},380);
}
const bgm=new Audio('https://files.catbox.moe/i3vyn2.mp3');bgm.loop=true;bgm.preload='auto';
document.getElementById('btn').addEventListener('click',()=>{
 bgm.play().catch(()=>{});
 document.getElementById('start').classList.add('hide');
 for(let i=0;i<14;i++){const s=18+Math.random()*16;add('heart',{left:Math.random()*90+'vw',width:s+'px',height:s+'px',animationDuration:3+Math.random()*2+'s'},H.replace('COL',cols[i%5]))}
 setTimeout(()=>{main.classList.add('show');setTimeout(()=>type(0),900)},700);
},{once:true});
</script></body></html>
